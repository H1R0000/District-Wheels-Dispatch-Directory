name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run local:setup
      - run: npm run test:integration
      - run: npx --no-install playwright install --with-deps chromium
      - name: Start local application and functions
        run: |
          npm run local:functions > /tmp/dcw-functions.log 2>&1 &
          npm run dev > /tmp/dcw-app.log 2>&1 &
          node scripts/wait-local.mjs
      - run: npm run test:browser
      - name: Startup diagnostics on failure
        if: failure()
        run: |
          tail -n 60 /tmp/dcw-functions.log /tmp/dcw-app.log 2>/dev/null || true
      - name: Browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: tmp/application-api-smoke-failure.png
          if-no-files-found: ignore
      - name: Stop test containers
        if: always()
        run: npx --no-install supabase stop --no-backup
