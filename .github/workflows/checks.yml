name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run local:setup
      - run: npm run test:integration
      - run: npx --no-install playwright install --with-deps chromium
      - name: Start local application and functions
        run: |
          npm run local:functions > /tmp/dcw-functions.log 2>&1 &
          npm run dev > /tmp/dcw-app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health && curl --fail --silent http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:browser
      - name: Stop test containers
        if: always()
        run: npx --no-install supabase stop --no-backup
